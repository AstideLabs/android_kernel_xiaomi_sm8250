name: Build All Devices Kernel (Matrix Parallel + Release)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish to GitHub Releases (是否发布到 GitHub Releases)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-matrix:
    name: Build ${{ matrix.device }} | ${{ matrix.ksu && 'KSU' || 'NoKSU' }} (AOSP + MIUI)
    # 关键：不再写 runs-on / steps，直接复用工作流1
    uses: ./.github/workflows/build.yaml
    strategy:
      fail-fast: false
      matrix:
        device:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
        ksu:
          - true
          - false
    with:
      device: ${{ matrix.device }}
      ksu: ${{ matrix.ksu }}
      target_os: both

  release:
    name: Publish GitHub Release
    if: ${{ inputs.publish_release }}
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate Release Info
        id: vars
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$(date +'%Y%m%d')-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "SHA_SHORT=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_kernels
          # 可复用工作流与被调用方属于同一个 run，run_id 一致，可直接按当前 run 下载
          pattern: APTKernel-*-${{ github.run_id }}
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "APTKernel Build - ${{ steps.vars.outputs.BUILD_DATE }} (${{ steps.vars.outputs.SHA_SHORT }})"
          body: |
            ## 自动构建内核发布 / Automated Kernel Release

            - **构建日期 / Build Date:** ${{ steps.vars.outputs.BUILD_DATE }}
            - **提交哈希 / Commit SHA:** `${{ steps.vars.outputs.SHA_SHORT }}`
            - **支持设备 / Supported Devices:** `alioth, apollo, cas, cmi, dagu, elish, enuma, lmi, munch, pipa, psyche, umi`

            ---
            ### 刷机包分类指南 / Flashable ZIP Instructions:
            - **MIUI**: 适用于原厂 MIUI / HyperOS 或基于 MIUI 修改的第三方 ROM。
            - **AOSP**: 适用于 LineageOS 等类原生 AOSP ROM。
            - **BakaSU-SuSFS**: 集成 BakaSU 与 SuSFS。
            - **NoKernelSU**: 原版纯净内核，支持自行使用 Magisk 或 APatch 刷入。
          files: all_kernels/*.zip
